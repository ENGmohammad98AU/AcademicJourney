name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "codex/v1.5.0", "codex/v1.5.1", "codex/v1.5.2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test, lint and build APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AcademicJourney-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports and UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AcademicJourney-verification
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/journey-ui
            app/build/reports/pdf
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload unsigned release APK for stable signing
        uses: actions/upload-artifact@v4
        with:
          name: AcademicJourney-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
